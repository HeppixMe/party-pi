<!DOCTYPE html>
<html lang="de" data-fx="plain">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bildschirm – LAN-Party</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* Die Huelle selbst ist nur ein Rahmen fuer die zugewiesene Seite. */
    html, body { height: 100%; overflow: hidden; }
    body::before, body::after { display: none; }   /* Gitter/Scanlines macht die innere Seite */

    #frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 1;
      transition: opacity 0.35s ease;
      background: var(--bg);
    }
    #frame.fading { opacity: 0; }

    /* Geteilter Bildschirm: zwei Ansichten nebeneinander statt einer. */
    #halves {
      position: fixed;
      inset: 0;
      display: flex;
    }
    #halves iframe {
      flex: 1 1 50%;
      width: 50%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    #halves .divider {
      flex: 0 0 auto;
      width: 2px;
      background: var(--line-hot);
      box-shadow: 0 0 10px var(--accent);
    }

    #idle {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }
    #idle .label {
      font-size: clamp(2rem, 12vh, 9rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: var(--glow);
      word-break: break-all;
    }
    #idle .hint {
      font-size: clamp(0.8rem, 2.4vh, 1.5rem);
      color: var(--muted);
      letter-spacing: 0.1em;
      max-width: 40ch;
      line-height: 1.6;
    }
    #status {
      position: fixed;
      right: 0.8rem;
      bottom: 0.8rem;
      z-index: 120;
    }
  </style>
</head>
<body>
  <iframe id="frame" title="Zugewiesene Ansicht" hidden
          allow="microphone; fullscreen; autoplay" allowfullscreen></iframe>

  <div id="halves" hidden>
    <iframe id="frame-left" title="Linke Hälfte" allow="microphone; fullscreen; autoplay" allowfullscreen></iframe>
    <div class="divider"></div>
    <iframe id="frame-right" title="Rechte Hälfte" allow="microphone; fullscreen; autoplay" allowfullscreen></iframe>
  </div>

  <div id="idle">
    <div class="label" id="name">…</div>
    <p class="hint">
      Dieser Bildschirm ist angemeldet. Im Admin unter „Bildschirme“ eine
      Ansicht darauf ziehen.
    </p>
  </div>

  <span class="badge" id="status">verbinde…</span>

  <script type="module" src="/static/screen.js"></script>
</body>
</html>
