<!DOCTYPE html>
<html lang="de" data-fx="plain">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geteilter Bildschirm – LAN-Party Leaderboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body::before, body::after { display: none; }   /* Gitter/Scanlines macht die innere Seite */

    #halves {
      position: fixed;
      inset: 0;
      display: flex;
    }
    #halves iframe {
      flex: 1 1 50%;
      width: 50%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    #halves .divider {
      flex: 0 0 auto;
      width: 2px;
      background: var(--line-hot);
      box-shadow: 0 0 10px var(--accent);
    }

    #missing {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div id="halves" hidden>
    <iframe id="left" title="Linke Hälfte"></iframe>
    <div class="divider"></div>
    <iframe id="right" title="Rechte Hälfte"></iframe>
  </div>

  <div id="missing">Diesen geteilten Bildschirm gibt es nicht (mehr).</div>

  <script type="module" src="/static/split.js"></script>
</body>
</html>
